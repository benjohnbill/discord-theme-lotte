<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    html, body { margin: 0; height: 100%; background: #1e1f3a; overflow: hidden; }
    #c { display: block; width: 100vw; height: 100vh; }
    #status { position: fixed; top: 8px; left: 8px; right: 8px; color: #fff; font: 13px monospace; white-space: pre-wrap; }
  </style>
</head>
<body>
  <div id="status">loading…</div>
  <canvas id="c"></canvas>
  <script src="https://cubism.live2d.com/sdk-web/cubismcore/live2dcubismcore.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi.js@6.5.10/dist/browser/pixi.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/pixi-live2d-display@0.4.0/dist/cubism4.min.js"></script>
  <script>
    (async () => {
      const status = document.getElementById('status');
      const log = (m) => { status.textContent += '\n' + m; };
      try {
        // Diagnostic: what's the highest moc3 version this Core can read?
        let coreMax = '?';
        try { coreMax = window.Live2DCubismCore.Version.csmGetLatestMocVersion(); } catch (e) {}
        status.textContent = 'core latest moc3 version = ' + coreMax + ' (our moc3 = ver 6)';

        const app = new PIXI.Application({
          view: document.getElementById('c'), resizeTo: window,
          backgroundAlpha: 0, autoStart: true,
        });
        const model = await PIXI.live2d.Live2DModel.from('./model/lotte-pilot.model3.json');
        app.stage.addChild(model);
        const fit = () => {
          const s = Math.min(window.innerWidth / model.width, window.innerHeight / model.height) * 0.85;
          model.scale.set(s); model.anchor.set(0.5, 0.5);
          model.position.set(window.innerWidth / 2, window.innerHeight / 2);
        };
        fit(); window.addEventListener('resize', fit);
        // Drive the rig from a focus point (top-right) so ParamAngleZ tilt + gaze respond.
        model.focus(window.innerWidth * 0.72, window.innerHeight * 0.30);
        window.addEventListener('mousemove', e => model.focus(e.clientX, e.clientY));
        log('MODEL LOADED ok — size ' + Math.round(model.width) + 'x' + Math.round(model.height) +
            ', PIXI ' + PIXI.VERSION + '. focus set top-right (head should tilt).');
      } catch (e) {
        log('ERROR: ' + (e && e.message ? e.message : e));
        console.error(e);
      }
    })();
  </script>
</body>
</html>
